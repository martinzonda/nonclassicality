# Conda environment for full reproducibility.
# Create with:  conda env create -f environment.yml
# Activate with: conda activate nonclassicality-lp
name: nonclassicality-lp
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=1.26.4
  - scipy=1.15.3
  - matplotlib=3.10.7
  - tqdm=4.67.3
  - pyyaml=6.0.3
  - pytest=9.0.3
  - ipykernel=6.29.5
  - pip
  - pip:
      # Optional: physical state generation (QuTiP).
      - qutip>=5.0
